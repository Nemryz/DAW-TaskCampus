<!doctype html>
<!-- Esta es la única página del proyecto porque la aplicación se dibuja entera dentro de una vista -->
<html lang="en">
  <head>
    <!-- Declarar la codificación de caracteres garantiza que los acentos de los títulos se lean bien -->
    <meta charset="UTF-8" />
    <!-- El icono se enlaza desde la carpeta pública porque Vite copia esa carpeta sin procesarla -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Esta línea hace que la interfaz se acomode al ancho disponible en pantallas pequeñas -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- El idioma declarado sigue en inglés aunque toda la interfaz esté en español, y N1 lo corrige -->
    <title>taskcampus</title>
  </head>
  <body>
    <!-- Este contenedor vacío es el punto de montaje que React necesita para dibujar la aplicación -->
    <div id="root"></div>
    <!-- El atributo module indica que el archivo usa la sintaxis moderna de imports de JavaScript -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
